<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon.png">
<title>Habits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=12">
</head>
<body>

<!-- Top nav — tabs rendered by renderNav() -->
<nav class="top-nav" id="topNav" aria-label="Main"></nav>

<!-- ── Habits (today, or a past day opened from History) ── -->
<main class="page" id="pageHabits">
  <header class="page-header">
    <h1 class="page-title" id="habitsCount">0/0</h1>
    <button class="chip" id="dateChip"></button>
  </header>
  <div class="list" id="habitList"></div>
</main>

<!-- ── History ── -->
<main class="page" id="pageHistory" hidden>
  <header class="page-header">
    <h1 class="page-title">History</h1>
    <button class="chip" id="historyBackChip">Habits</button>
  </header>
  <div class="list" id="historyList"></div>
  <button class="load-more" id="historyMore">Load more</button>
</main>

<!-- ── Push / Pull / Legs ── -->
<main class="page" id="pageWorkout" hidden>
  <header class="page-header">
    <h1 class="page-title" id="workoutTitle"></h1>
    <button class="chip" id="workoutDoneChip">Done</button>
  </header>
  <div class="list" id="workoutList"></div>
</main>

<!-- ── Skills: Strava racket sessions (data/strava/*.json) + warm up / affirmations / cool down ── -->
<main class="page" id="pageSkills" hidden>
  <header class="page-header">
    <h1 class="page-title">Skills</h1>
    <button class="chip" id="skillsWeekChip"></button>
  </header>
  <div id="skillsWeekBody"></div>
  <div class="subnav" id="skillsSubnav"></div>
  <div class="list" id="skillsList"></div>
</main>

<!-- ── Bike: Strava week (data/strava/*.json) + warm up / cool down ── -->
<main class="page" id="pageBike" hidden>
  <header class="page-header">
    <h1 class="page-title">Cycling</h1>
    <button class="chip" id="weekChip"></button>
  </header>
  <div id="weekBody"></div>
  <div class="subnav" id="bikeSubnav"></div>
  <div class="list" id="bikeList"></div>
</main>

<!-- ── Bike / Skills history (one row per week) ── -->
<main class="page" id="pageStravaHistory" hidden>
  <header class="page-header">
    <h1 class="page-title">History</h1>
    <button class="chip" id="stravaHistoryBackChip"></button>
  </header>
  <div class="list" id="stravaHistoryList"></div>
  <button class="load-more" id="stravaHistoryMore">Load more</button>
</main>

<script src="js/app.js?v=20"></script>

</body>
</html>
