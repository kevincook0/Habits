<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="Check.png">
<title>Habits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body>

<!-- Top nav — tabs rendered by renderNav() -->
<nav class="top-nav" id="topNav" aria-label="Main"></nav>

<!-- ── Habits (today, or a past day opened from History) ── -->
<main class="page" id="pageHabits">
  <header class="page-header">
    <h1 class="page-title" id="habitsCount">0/0</h1>
    <button class="chip" id="dateChip"></button>
  </header>
  <div class="list" id="habitList"></div>
</main>

<!-- ── History ── -->
<main class="page" id="pageHistory" hidden>
  <header class="page-header">
    <h1 class="page-title">History</h1>
    <button class="chip" id="historyBackChip">Habits</button>
  </header>
  <div class="list" id="historyList"></div>
  <button class="load-more" id="historyMore">Load more</button>
</main>

<!-- ── Push / Pull / Legs ── -->
<main class="page" id="pageWorkout" hidden>
  <header class="page-header">
    <h1 class="page-title" id="workoutTitle"></h1>
  </header>
  <div class="list" id="workoutList"></div>
</main>

<!-- ── Skills ── -->
<main class="page" id="pageSkills" hidden>
  <div class="subnav" id="skillsSubnav"></div>
  <div class="list" id="skillsList"></div>
</main>

<!-- ── Bike ── -->
<main class="page" id="pageBike" hidden>
  <header class="page-header">
    <h1 class="page-title">Volume</h1>
  </header>
  <div class="list section-gap">
    <div class="ex">
      <div class="ex-head">
        <span class="row-label">Zone 2</span>
        <span class="row-meta" id="bikeGoal"></span>
      </div>
      <div class="stepper stepper-wide">
        <button class="stepper-btn" data-bike="-1" aria-label="Less">−</button>
        <span class="stepper-val" id="bikeVal"></span>
        <button class="stepper-btn" data-bike="1" aria-label="More">+</button>
      </div>
    </div>
  </div>
  <div class="subnav" id="bikeSubnav"></div>
  <div class="list" id="bikeList"></div>
</main>

<!-- Fixed footer action (Mark as done / Save progress) -->
<div class="footer" id="footer" hidden>
  <button class="footer-btn" id="footerBtn"></button>
</div>

<script src="js/app.js?v=3"></script>

</body>
</html>
